<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <div class="container">

            <div class="from">
                <h3>FROM</h3>
                <img src="https://flagsapi.com/IN/flat/64.png">
                <select name="from" class="from-select">
                   
                </select>
                <input type="number" placeholder="enter amount" class="amount">
            </div>

            <div class="ex-icon">
                <img  src="transfer_876784.png">
            </div>

            <div class="to">
                <H3>TO</H3>
                <img src="https://flagsapi.com/US/flat/64.png">
                <select name="from" class="to-select">
                   
                </select>
                <div >
                   <p class="answer"></p>

                </div>

            </div>

        </div>
        <p class="rate"></p>
        
        <button class="submit">GET VALUE</button>

        </div>

        <script src="index.js" type="module"></script>


    </body>
</html>
